[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.99"

[workspace.dependencies]
ciproxy-metering = { path = "crates/ciproxy-metering" }
ciproxy-gateway = { path = "crates/ciproxy-gateway" }
ciproxy-protocol = { path = "crates/ciproxy-protocol" }
ciproxy-schema = { path = "crates/ciproxy-schema" }
ciproxy-store-interface = { path = "crates/ciproxy-store-interface" }
ciproxy-store-pg = { path = "crates/ciproxy-store-pg" }
internal-error = { git = "https://github.com/futex-ai/internal-error", rev = "d7b94d766bf2844aa0b4a801fd21c465543e8a58" }
