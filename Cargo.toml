[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.99"

[workspace.dependencies]
ciproxy-protocol = { path = "crates/ciproxy-protocol" }

cli-updater = { git = "https://github.com/futex-ai/cli-release", rev = "30513bd1a6e15d8e9c1b18f2ed92d1d4dfa11786", version = "0.1.0" }

internal-error = { git = "https://github.com/futex-ai/internal-error", rev = "d7b94d766bf2844aa0b4a801fd21c465543e8a58", version = "0.1.0" }
