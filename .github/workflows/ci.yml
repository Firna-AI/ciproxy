name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository gate
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ciproxy
          POSTGRES_PASSWORD: ciproxy
          POSTGRES_DB: ciproxy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciproxy -d ciproxy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ciproxy:ciproxy@127.0.0.1:5432/ciproxy_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install TypeScript packages
        run: npm --prefix ts ci
      - name: Run the complete gate
        run: cargo xtask check --keep-going

  macos:
    name: macOS crates
    # Apple Silicon. GitHub-hosted runners cannot run nested VMs, so tests
    # that start a VM stay out of this job and run on the test Mac.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # The crates with macOS code. Add a crate here when it builds and
      # tests on macOS.
      MACOS_PACKAGES: ciproxy-protocol ciproxy-vz ciproxy-guest ciproxy-cache-sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f 1)"
      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
      - name: Build and test the macOS crates
        run: |
          set -euo pipefail
          args=()
          for package in $MACOS_PACKAGES; do args+=(--package "$package"); done
          cargo build --locked "${args[@]}"
          cargo test --locked "${args[@]}"
      - name: Sign the agent ad hoc and check it
        if: contains(format(' {0} ', env.MACOS_PACKAGES), ' ciproxy-agent ')
        run: |
          set -euo pipefail
          binary=target/debug/ciproxy-agent
          version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "ciproxy-agent") | .version')"
          crates/ciproxy-agent/scripts/macos-release.sh sign "$binary"
          crates/ciproxy-agent/scripts/macos-release.sh verify "$binary" "$MACOSX_DEPLOYMENT_TARGET" false "$version"
          crates/ciproxy-agent/scripts/cli-release.sh package ciproxy-agent "$version" aarch64-apple-darwin "$binary" "$RUNNER_TEMP/agent-release"
          tar -tzf "$RUNNER_TEMP/agent-release/ciproxy-agent-$version-aarch64-apple-darwin.tar.gz"
