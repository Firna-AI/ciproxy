name: Apply saved Terraform plans

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source:
        required: true
        type: string
      stage:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Apply exact saved plans
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      CIPROXY_SOURCE_SHA: ${{ inputs.source }}
      CIPROXY_ENVIRONMENT: ${{ inputs.environment }}
      CIPROXY_STAGE: ${{ inputs.stage }}
      CIPROXY_REUSABLE_APPLY: "true"
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Checkout the plan commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py "$CIPROXY_ENVIRONMENT" "$CIPROXY_SOURCE_SHA"
      - name: Download this run attempt's saved plans
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plan-${{ inputs.environment }}-${{ inputs.stage }}-${{ github.run_attempt }}
          path: .context/plans/${{ inputs.environment }}${{ inputs.stage == 'edge' && '/edge' || '' }}
      - name: Authenticate the dedicated apply identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_APPLY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Recheck the binaries and apply them in root order
        run: |
          case "$CIPROXY_STAGE" in
            infrastructure) roots=(seed bootstrap foundation) ;;
            edge) roots=(edge) ;;
            *) echo "Unknown apply stage" >&2; exit 1 ;;
          esac
          for root in "${roots[@]}"; do
            python3 deploy/scripts/terraform.py apply "$CIPROXY_ENVIRONMENT" "$root"
          done
      - name: Set up Google Cloud tools
        if: inputs.stage == 'edge'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 592.0.0
      - name: Invalidate the CDN after edge apply
        if: inputs.stage == 'edge'
        run: python3 deploy/scripts/deploy.py "$CIPROXY_ENVIRONMENT" --phase invalidate
