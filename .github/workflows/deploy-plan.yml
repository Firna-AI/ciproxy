name: Save Terraform plans
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      source:
        required: true
        type: string
      scope:
        required: true
        type: string
    outputs:
      roots:
        value: ${{ jobs.plan.outputs.roots }}
permissions:
  contents: read
  id-token: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    outputs:
      roots: ${{ steps.route.outputs.roots }}
    env:
      CIPROXY_SOURCE_SHA: ${{ inputs.source }}
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Checkout the deployment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Check the trusted source event
        run: python3 deploy/scripts/promotion_event.py "${{ inputs.environment }}" "$CIPROXY_SOURCE_SHA"
      - name: Authenticate the environment plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ciproxy
          workload_identity_provider: ${{ vars.GCP_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Select roots using the GCP launch latch
        id: route
        run: python3 deploy/scripts/ci_roots.py "${{ inputs.environment }}" "${{ inputs.scope }}"
      - name: Authenticate the central read-only plan identity
        if: inputs.scope != 'foundation' && steps.route.outputs.roots != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ciproxy
          workload_identity_provider: ${{ vars.GCP_SHARED_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SHARED_PLAN_SERVICE_ACCOUNT }}
      - name: Download this run's completed workload inputs
        if: inputs.scope == 'foundation'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: workload-${{ inputs.environment }}-${{ github.run_attempt }}
          path: .context/deploy/${{ inputs.environment }}
      - name: Save and check exact plans
        if: steps.route.outputs.roots != ''
        env:
          ROOTS: ${{ steps.route.outputs.roots }}
        run: |
          for root in $ROOTS; do
            python3 deploy/scripts/terraform.py plan "${{ inputs.environment }}" "$root"
          done
      - name: Publish saved plan evidence
        if: always() && steps.route.outputs.roots != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plan-${{ inputs.environment }}-${{ inputs.scope }}-${{ github.run_attempt }}
          path: .context/plans/${{ inputs.environment }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
