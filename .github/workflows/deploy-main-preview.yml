name: Deploy main preview
on:
  push:
    branches: [calummoore/ci-proxy-load-balancer, main]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: deploy-main-preview
  cancel-in-progress: false
jobs:
  infrastructure:
    uses: ./.github/workflows/deploy-infrastructure.yml
    with:
      environment: main-preview
      source: ${{ github.sha }}
  image-lookup:
    needs: infrastructure
    runs-on: ubuntu-24.04
    environment: main-preview
    permissions:
      contents: read
      id-token: write
    outputs:
      source_hash: ${{ steps.inputs.outputs.source_hash }}
      tools_sha: ${{ steps.inputs.outputs.tools_sha }}
      image: ${{ steps.lookup.outputs.image }}
    steps:
      - name: Checkout trusted image tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact source inputs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py main-preview "${{ github.sha }}"
      - name: Hash the exact build inputs
        id: inputs
        run: python3 deploy/scripts/control_plane_image.py inputs --source source --revision "${{ github.sha }}"
      - name: Install pinned crane
        run: bash deploy/scripts/install-image-tools.sh
      - name: Authenticate the image lookup identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ciproxy
          workload_identity_provider: ${{ vars.GCP_IMAGE_LOOKUP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_LOOKUP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
      - name: Reuse the source image or select an explicit rollback
        id: lookup
        env:
          SOURCE_HASH: ${{ steps.inputs.outputs.source_hash }}
          ROLLBACK_IMAGE: ${{ vars.CONTROL_PLANE_ROLLBACK_IMAGE }}
        run: python3 deploy/scripts/control_plane_image.py lookup --source-hash "$SOURCE_HASH" --rollback "$ROLLBACK_IMAGE"
  image-build:
    needs: image-lookup
    if: needs.image-lookup.outputs.image == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted image tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.image-lookup.outputs.tools_sha }}
          persist-credentials: false
      - name: Checkout exact source inputs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Install pinned BuildKit and start it
        run: |
          bash deploy/scripts/install-image-tools.sh build
          bash deploy/scripts/start-buildkit.sh
      - name: Build without cloud credentials
        env:
          SOURCE_HASH: ${{ needs.image-lookup.outputs.source_hash }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          python3 deploy/scripts/control_plane_image.py build
          --source source --revision "$SOURCE_SHA" --source-hash "$SOURCE_HASH"
          --archive .context/control-plane-image/control-plane.tar
      - name: Transfer the image archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-plane-image-${{ github.run_attempt }}
          path: .context/control-plane-image/control-plane.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  image-publish:
    needs: [image-lookup, image-build]
    if: >-
      always() && needs.image-lookup.result == 'success' &&
      (needs.image-build.result == 'success' || needs.image-build.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: main-preview
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout trusted publish tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.image-lookup.outputs.tools_sha }}
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py main-preview "${{ github.sha }}"
      - name: Install pinned crane
        if: needs.image-lookup.outputs.image == ''
        run: bash deploy/scripts/install-image-tools.sh
      - name: Download the built image
        if: needs.image-lookup.outputs.image == ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: control-plane-image-${{ github.run_attempt }}
          path: .context/control-plane-image
      - name: Authenticate the image publisher
        if: needs.image-lookup.outputs.image == ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ciproxy
          workload_identity_provider: ${{ vars.GCP_IMAGE_PUBLISH_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISH_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        if: needs.image-lookup.outputs.image == ''
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
      - name: Select the immutable deployment image
        id: image
        env:
          SOURCE_HASH: ${{ needs.image-lookup.outputs.source_hash }}
          EXISTING_IMAGE: ${{ needs.image-lookup.outputs.image }}
        run: >-
          python3 deploy/scripts/control_plane_image.py publish
          --source-hash "$SOURCE_HASH" --existing "$EXISTING_IMAGE"
          --archive .context/control-plane-image/control-plane.tar
  workloads:
    needs: [infrastructure, image-publish]
    if: >-
      always() && needs.infrastructure.result == 'success' &&
      needs.image-publish.result == 'success'
    runs-on: ubuntu-24.04
    environment: main-preview
    env:
      CIPROXY_SOURCE_SHA: ${{ github.sha }}
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      PUBLIC_UPTIME_ENABLED: ${{ vars.PUBLIC_UPTIME_ENABLED }}
      RELEASE_SERVER_IMAGE_DIGEST: ${{ vars.RELEASE_SERVER_IMAGE_DIGEST }}
      CONTROL_PLANE_RUNTIME_READY: ${{ vars.CONTROL_PLANE_RUNTIME_READY }}
      CONTROL_PLANE_IMAGE: ${{ needs.image-publish.outputs.image }}
      CDN_SIGNING_KEY_NAME: ${{ vars.CDN_SIGNING_KEY_NAME }}
      CIPROXY_APP_ID: ${{ vars.CIPROXY_APP_ID }}
      CIPROXY_APP_CLIENT_ID: ${{ vars.CIPROXY_APP_CLIENT_ID }}
      CIPROXY_APP_SLUG: ${{ vars.CIPROXY_APP_SLUG }}
      JOB_IMAGE_MANIFEST_PATH: ${{ vars.JOB_IMAGE_MANIFEST_PATH }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Checkout the deployment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py main-preview "$CIPROXY_SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install and export static sites
        run: |
          npm --prefix ts ci
          npm --prefix ts run site:build
          npm --prefix ts run app:export
      - name: Authenticate the workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ciproxy
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
          install_components: gke-gcloud-auth-plugin,kubectl
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Set up Helm
        run: bash deploy/scripts/install-helm.sh
      - name: Deploy own namespace and static buckets, then wait for NEGs
        run: python3 deploy/scripts/deploy.py main-preview
      - name: Save the completed workload inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workload-main-preview-${{ github.run_attempt }}
          path: .context/deploy/main-preview/ready-inputs.json
          if-no-files-found: error
          retention-days: 7
  plan-foundation:
    needs: workloads
    uses: ./.github/workflows/deploy-plan.yml
    with:
      environment: main-preview
      source: ${{ github.sha }}
      scope: foundation
  apply-foundation:
    needs: plan-foundation
    uses: ./.github/workflows/deploy-apply.yml
    with:
      environment: main-preview
      source: ${{ github.sha }}
      scope: foundation
  plan-edge:
    needs: apply-foundation
    uses: ./.github/workflows/deploy-plan.yml
    with:
      environment: main-preview
      source: ${{ github.sha }}
      scope: edge
  apply-edge:
    needs: plan-edge
    uses: ./.github/workflows/deploy-apply.yml
    with:
      environment: main-preview
      source: ${{ github.sha }}
      scope: edge
  invalidate:
    needs: [plan-edge, apply-edge]
    runs-on: ubuntu-24.04
    environment: main-preview
    env:
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Checkout the deployment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py main-preview "${{ github.sha }}"
      - name: Authenticate the workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Invalidate own CDN cache
        run: python3 deploy/scripts/deploy.py main-preview --phase invalidate
