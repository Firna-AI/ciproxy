name: Deploy production
on:
  workflow_run:
    workflows: [Deploy main preview]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  infrastructure:
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      github.repository == 'Firna-AI/ciproxy' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/deploy-infrastructure.yml
    with:
      environment: production
      source: ${{ github.event.workflow_run.head_sha }}
  workloads:
    needs: infrastructure
    runs-on: ubuntu-24.04
    environment: production
    env:
      CIPROXY_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      PUBLIC_UPTIME_ENABLED: ${{ vars.PUBLIC_UPTIME_ENABLED }}
      RELEASE_SERVER_IMAGE_DIGEST: ${{ vars.RELEASE_SERVER_IMAGE_DIGEST }}
      CONTROL_PLANE_RUNTIME_READY: ${{ vars.CONTROL_PLANE_RUNTIME_READY }}
      CONTROL_PLANE_IMAGE: ${{ vars.CONTROL_PLANE_IMAGE }}
      CDN_SIGNING_KEY_NAME: ${{ vars.CDN_SIGNING_KEY_NAME }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - name: Checkout the deployment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py production "$CIPROXY_SOURCE_SHA"
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Install and export static sites
        run: |
          npm --prefix ts ci
          npm --prefix ts run site:build
          npm --prefix ts run app:export
      - name: Authenticate the workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ciproxy
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
          install_components: gke-gcloud-auth-plugin,kubectl
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Set up Helm
        run: bash deploy/scripts/install-helm.sh
      - name: Deploy own namespace and static buckets, then wait for NEGs
        run: python3 deploy/scripts/deploy.py production
      - name: Save the completed workload inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workload-production-${{ github.run_attempt }}
          path: .context/deploy/production/ready-inputs.json
          if-no-files-found: error
          retention-days: 7
  plan-foundation:
    needs: workloads
    uses: ./.github/workflows/deploy-plan.yml
    with:
      environment: production
      source: ${{ github.event.workflow_run.head_sha }}
      scope: foundation
  apply-foundation:
    needs: plan-foundation
    uses: ./.github/workflows/deploy-apply.yml
    with:
      environment: production
      source: ${{ github.event.workflow_run.head_sha }}
      scope: foundation
  plan-edge:
    needs: apply-foundation
    uses: ./.github/workflows/deploy-plan.yml
    with:
      environment: production
      source: ${{ github.event.workflow_run.head_sha }}
      scope: edge
  apply-edge:
    needs: plan-edge
    if: needs.plan-edge.outputs.roots != ''
    uses: ./.github/workflows/deploy-apply.yml
    with:
      environment: production
      source: ${{ github.event.workflow_run.head_sha }}
      scope: edge
  invalidate:
    needs: [plan-edge, apply-edge]
    if: ${{ always() && !cancelled() && needs.plan-edge.result == 'success' && (needs.apply-edge.result == 'success' || needs.apply-edge.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
    steps:
      - name: Checkout the deployment commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check the trusted deployment event
        run: python3 deploy/scripts/promotion_event.py production "${{ github.event.workflow_run.head_sha }}"
      - name: Authenticate the workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud tools
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 592.0.0
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Invalidate own CDN cache
        run: python3 deploy/scripts/deploy.py production --phase invalidate
