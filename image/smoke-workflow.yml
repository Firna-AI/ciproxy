# SPDX-License-Identifier: Apache-2.0
# Copy this workflow into a private smoke repository. Queue it separately.
name: ciproxy full image smoke
on: workflow_dispatch
jobs:
  image:
    runs-on: ciproxy-image-smoke
    steps:
      - name: Check compressed swap
        run: |
          swapon --show || true
          if [ ! -e /sys/class/zram-control ]; then
            echo '::warning::This kernel has no zram, so the job runs without compressed swap.'
            exit 0
          fi
          if [ ! -r /proc/swaps ]; then
            echo 'Cannot read /proc/swaps on a kernel with zram.' >&2
            exit 1
          fi
          awk '
            $1 == "MemTotal:" {
              cap_kib = 8 * 1024 * 1024
              expected_kib = ($2 < cap_kib ? $2 : cap_kib)
              tolerance_kib = 64
            }
            $1 ~ /^\/dev\/zram[0-9]+$/ && expected_kib > 0 &&
              $3 >= expected_kib - tolerance_kib && $3 <= expected_kib + tolerance_kib { found = 1 }
            END {
              if (!found) {
                printf "Expected an active zram swap within 64 KiB of %d KiB.\n",
                  expected_kib > "/dev/stderr"
                exit 1
              }
            }
          ' /proc/meminfo /proc/swaps
      - run: |
          uname -a
          id
          python3 --version
          node --version
          dotnet --list-sdks
          java -version
          docker version
          docker run --rm hello-world
          sudo systemctl start postgresql
          pg_isready
          sudo -u postgres psql --no-psqlrc --tuples-only --command 'SELECT 1'
          df --block-size=1 /
