[package]
name = "ciproxy-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ciproxy-gateway = { workspace = true }
ciproxy-github = { workspace = true }
ciproxy-protocol = { workspace = true }
ciproxy-store-interface = { workspace = true }
getrandom = "0.4.3"
internal-error = { workspace = true }
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
rust_decimal = "1.43.0"
scaleset = "0.2.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
unimock = "0.6.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
ciproxy-store-pg = { workspace = true }
diesel = { version = "2.3.14", features = ["postgres"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
