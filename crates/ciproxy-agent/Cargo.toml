[package]
name = "ciproxy-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
async-trait = "0.1.92"
ciproxy-protocol = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
cli-updater = { workspace = true }
flate2 = "1.1.10"
fs2 = "0.4.3"
futures-util = "0.3.34"
hex = "0.4.3"
internal-error = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
unimock = "0.6.8"
