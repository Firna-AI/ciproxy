[package]
name = "ciproxy-billing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
ciproxy-store-interface = { workspace = true }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
unimock = "0.6.8"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
ciproxy-store-pg = { workspace = true }
diesel = { version = "2.3.14", features = ["postgres"] }
tiny_http = "0.12.0"
