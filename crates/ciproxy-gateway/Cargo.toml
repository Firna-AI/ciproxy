[package]
name = "ciproxy-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
ciproxy-protocol = { workspace = true }
ciproxy-store-interface = { workspace = true }
getrandom = "0.4.3"
internal-error = { workspace = true }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tracing = "0.1.44"
unimock = "0.6.8"
uuid = "1.29.0"

[dev-dependencies]
ciproxy-store-pg = { workspace = true }
diesel = { version = "2.3.14", features = ["postgres"] }
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { version = "1.54.1", features = ["time"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
