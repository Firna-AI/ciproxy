[package]
name = "ciproxy-image-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "The VM tool of the macOS image build, over ciproxy-vz"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
ciproxy-vz = { path = "../ciproxy-vz", features = ["private-vnc"] }
futures-executor = "0.3.34"
