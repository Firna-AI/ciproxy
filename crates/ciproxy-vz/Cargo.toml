[package]
name = "ciproxy-vz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
description = "macOS VMs on Apple Silicon over Virtualization.framework"

[features]
# The private `_VZVNCServer` of Virtualization.framework. Apple does not
# document it, and it can change or go away in any macOS release.
private-vnc = []

[dependencies]
getrandom = "0.4.3"
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
futures-channel = "0.3.34"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-virtualization = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
futures-executor = "0.3.34"
libc = "0.2.191"
