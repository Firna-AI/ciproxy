[package]
name = "ciproxy-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"

[dependencies]
async-trait = "0.1.92"
ciproxy-protocol = { workspace = true }
internal-error = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-vsock = "0.7.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
unimock = "0.6.8"
