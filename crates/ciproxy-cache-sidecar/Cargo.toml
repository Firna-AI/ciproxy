[package]
name = "ciproxy-cache-sidecar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
ciproxy-protocol = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.5", features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
ciproxy-agent = { workspace = true }
unimock = "0.6.8"
