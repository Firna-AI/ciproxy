{{- if .Values.controlPlane.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: control-plane
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $file, $resource := .Values.controlPlane.secrets }}
      - resourceName: {{ printf "%s/versions/latest" $resource | quote }}
        path: {{ $file | quote }}
      {{- end }}
{{- end }}
