apiVersion: v1
kind: Service
metadata:
  name: release-neg
  annotations:
    cloud.google.com/neg: {{ dict "exposed_ports" (dict "8080" (dict "name" (printf "%s-release" .Values.prefix))) "zones" .Values.allowedZones | toJson | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cli-release-server
    app.kubernetes.io/instance: {{ .Values.releaseServer.instance }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
# The operator creates control-plane and records its UID. Helm never owns it.
{{- if .Values.controlPlane.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-neg
  annotations:
    cloud.google.com/neg: {{ dict "exposed_ports" (dict "8080" (dict "name" (printf "%s-control" .Values.prefix))) "zones" .Values.allowedZones | toJson | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ciproxy-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
