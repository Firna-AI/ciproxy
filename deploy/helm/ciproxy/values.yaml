prefix: ciproxy-main-preview
# The deploy command supplies the foundation's complete allowed zone set.
allowedZones: []

releaseServer:
  instance: cli-release-server

# Enable after runtime setup supplies the image, settings, and secret versions.
controlPlane:
  enabled: false
  image: ""
  replicas: 1
  sqlConnection: ""
  sqlUser: ""
  sqlProxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.27.0
  kmsKey: ""
  # Public Kubernetes Secret revision. The share code never enters Helm values.
  boatSharedSnapshotRevision: ""
  publicUrl: https://br-main.preview.app.ciproxy.dev
  imageUrlPrefix: https://br-main.preview.app.ciproxy.dev/images/
  # Registration prints <prefix>-images-v<N>. N pins the mounted key version.
  cdnSigningKeyName: ""
  # Map of file names to Secret Manager resource IDs, without /versions/...
  secrets: {}
  env: []
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi
